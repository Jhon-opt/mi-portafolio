<section class="relative min-h-screen flex flex-col items-center justify-center text-center overflow-hidden bg-white dark:bg-gray-950 transition-colors duration-500">
  
  <!-- Animated Background Elements -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-purple-500/10 blur-[120px] animate-pulse"></div>
    <div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] rounded-full bg-indigo-500/10 blur-[120px] animate-pulse" style="animation-delay: 2s"></div>
  </div>

  <div class="relative z-10 px-6 mt-10">
    <!-- Nuevo Badge Rectangular -->
    <div class="inline-flex items-center px-5 py-2 mb-10 bg-white/60 dark:bg-gray-900/60 backdrop-blur-md border-l-4 border-indigo-500 shadow-lg text-gray-800 dark:text-gray-200 transform hover:translate-x-2 transition-transform duration-300">
      <span class="relative flex h-3 w-3 mr-3">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
      </span>
      <span class="font-mono text-sm font-semibold tracking-wide uppercase">{{ langService.t().hero.badge }}</span>
    </div>

    <!-- Nombre -->
    <h1 class="text-6xl md:text-8xl font-mono font-extrabold mb-6 tracking-tighter text-gray-900 dark:text-white">
      {{ langService.t().hero.name }} <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-500 to-purple-600">Durango</span>
    </h1>

    <!-- Rol -->
    <h2 class="text-2xl md:text-4xl font-mono font-medium text-gray-600 dark:text-gray-400 mb-12">
      {{ langService.t().hero.role }} <span class="text-indigo-500">&lt;/&gt;</span>
    </h2>

    <!-- Logos de tecnologías con scroll horizontal infinito -->
    <div class="relative w-full max-w-3xl mx-auto mt-8 overflow-hidden">
      <!-- Gradient Masks for smooth entry/exit -->
      <div class="absolute inset-y-0 left-0 w-24 bg-gradient-to-r from-white dark:from-gray-950 to-transparent z-10"></div>
      <div class="absolute inset-y-0 right-0 w-24 bg-gradient-to-l from-white dark:from-gray-950 to-transparent z-10"></div>
      
      <div class="flex gap-12 animate-marquee py-4 w-max">
        <!-- Primer set de logos -->
        <div class="flex gap-12 items-center">
          <div class="group relative flex flex-col items-center">
            <img src="icons/angular.webp" alt="Angular" class="w-14 h-14 object-contain group-hover:scale-110 transition-transform" />
            <span class="absolute -bottom-6 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-mono text-gray-500">Angular</span>
          </div>
          <div class="group relative flex flex-col items-center">
            <img src="icons/ts.png" alt="TypeScript" class="w-14 h-14 object-contain group-hover:scale-110 transition-transform" />
            <span class="absolute -bottom-6 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-mono text-gray-500">TypeScript</span>
          </div>
          <div class="group relative flex flex-col items-center">
            <img src="icons/csharp.png" alt="C# .NET" class="w-14 h-14 object-contain group-hover:scale-110 transition-transform bg-gray-50 dark:bg-gray-800 rounded-lg p-1" />
            <span class="absolute -bottom-6 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-mono text-gray-500">C# .NET</span>
          </div>
          <div class="group relative flex flex-col items-center">
            <img src="icons/postgres.png" alt="PostgreSQL" class="w-14 h-14 object-contain group-hover:scale-110 transition-transform bg-gray-50 dark:bg-gray-800 rounded-lg p-1" />
            <span class="absolute -bottom-6 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-mono text-gray-500">PostgreSQL</span>
          </div>
          <div class="group relative flex flex-col items-center">
            <img src="icons/docker.png" alt="Docker" class="w-14 h-14 object-contain group-hover:scale-110 transition-transform bg-gray-50 dark:bg-gray-800 rounded-lg p-1" />
            <span class="absolute -bottom-6 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-mono text-gray-500">Docker</span>
          </div>
          <div class="group relative flex flex-col items-center">
            <img src="icons/node.png" alt="Node.js" class="w-14 h-14 object-contain group-hover:scale-110 transition-transform bg-gray-50 dark:bg-gray-800 rounded-lg p-1" />
            <span class="absolute -bottom-6 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-mono text-gray-500">Node.js</span>
          </div>
        </div>
        <!-- Duplicado para loop infinito -->
        <div class="flex gap-12 items-center">
          <div class="group relative flex flex-col items-center">
            <img src="icons/angular.webp" alt="Angular" class="w-14 h-14 object-contain group-hover:scale-110 transition-transform" />
            <span class="absolute -bottom-6 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-mono text-gray-500">Angular</span>
          </div>
          <div class="group relative flex flex-col items-center">
            <img src="icons/ts.png" alt="TypeScript" class="w-14 h-14 object-contain group-hover:scale-110 transition-transform" />
            <span class="absolute -bottom-6 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-mono text-gray-500">TypeScript</span>
          </div>
          <div class="group relative flex flex-col items-center">
            <img src="icons/csharp.png" alt="C# .NET" class="w-14 h-14 object-contain group-hover:scale-110 transition-transform bg-gray-50 dark:bg-gray-800 rounded-lg p-1" />
            <span class="absolute -bottom-6 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-mono text-gray-500">C# .NET</span>
          </div>
          <div class="group relative flex flex-col items-center">
            <img src="icons/postgres.png" alt="PostgreSQL" class="w-14 h-14 object-contain group-hover:scale-110 transition-transform bg-gray-50 dark:bg-gray-800 rounded-lg p-1" />
            <span class="absolute -bottom-6 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-mono text-gray-500">PostgreSQL</span>
          </div>
          <div class="group relative flex flex-col items-center">
            <img src="icons/docker.png" alt="Docker" class="w-14 h-14 object-contain group-hover:scale-110 transition-transform bg-gray-50 dark:bg-gray-800 rounded-lg p-1" />
            <span class="absolute -bottom-6 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-mono text-gray-500">Docker</span>
          </div>
          <div class="group relative flex flex-col items-center">
            <img src="icons/node.png" alt="Node.js" class="w-14 h-14 object-contain group-hover:scale-110 transition-transform bg-gray-50 dark:bg-gray-800 rounded-lg p-1" />
            <span class="absolute -bottom-6 opacity-0 group-hover:opacity-100 transition-opacity text-[10px] font-mono text-gray-500">Node.js</span>
          </div>
        </div>
      </div>
    </div>

    <!-- CTA Scroll -->
    <div class="mt-24 animate-bounce">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-gray-400 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
      </svg>
    </div>
  </div>
</section>
